name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

# Action versions matter here. GitHub deprecated Node 20 on its runners and
# now forces older actions onto Node 24, under which upload-pages-artifact@v3
# reported success but produced no artifact at all — deploy-pages then waited
# for something that never arrived and aborted at its 10-minute timeout.
# Keep these current; a silent empty artifact is the symptom if they drift.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Fail loudly here rather than letting an empty artifact stall the deploy.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/tsolak.jpg || { echo "dist/tsolak.jpg missing"; exit 1; }
          echo "dist contents:"; ls -la dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 600000 (10 min), after which the action CANCELS the
          # deployment. Pages here consistently needs longer — runs were being
          # reported as failures while the content actually published moments
          # later. 30 minutes, and a slower poll to keep the log readable.
          timeout: 1800000
          reporting_interval: 15000
